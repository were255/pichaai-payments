<!DOCTYPE html>
<html>
<head>
  <title>PichaAI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px;
      line-height: 1.5;
      color: #222;
    }
    h1,
    h2 {
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }
    input {
      padding: 10px;
      margin: 0;
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #1f6feb;
      color: white;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #1558c7;
    }
    .chat-history {
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #ddd;
      background: #fafafa;
      max-height: 420px;
      overflow-y: auto;
    }
    .message {
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      max-width: 90%;
      word-break: break-word;
    }
    .message.user {
      background: #dbeafe;
      color: #023047;
      align-self: flex-end;
      margin-left: auto;
    }
    .message.ai {
      background: #e7f7ef;
      color: #064e3b;
      align-self: flex-start;
    }
    .message.error {
      background: #fdecea;
      color: #7f1d1d;
      border: 1px solid #fca5a5;
    }
    .status {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>PichaAI Chat</h1>

  <div class="row">
    <input id="input" placeholder="Type message..." />
    <button onclick="send()">Send</button>
  </div>

  <h2>Pay with M-Pesa</h2>
  <div class="row">
    <input id="phone" placeholder="Phone number e.g. 254700000000" />
    <input id="amount" placeholder="Amount" type="number" min="1" />
    <button onclick="pay()">Pay</button>
  </div>

  <div id="status" class="status"></div>
  <div id="chatHistory" class="chat-history"></div>

  <script>
    const chatHistory = document.getElementById("chatHistory");
    const status = document.getElementById("status");
    const sendButton = document.querySelector("button[onclick='send()']");
    const payButton = document.querySelector("button[onclick='pay()']");

    function appendMessage(text, role) {
      const msg = document.createElement("div");
      msg.className = `message ${role}`;
      msg.textContent = text;
      chatHistory.appendChild(msg);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function setStatus(text) {
      status.textContent = text;
    }

    function setLoading(isLoading) {
      sendButton.disabled = isLoading;
      payButton.disabled = isLoading;
      setStatus(isLoading ? "Waiting for AI / payment response..." : "");
    }

    async function send() {
      const message = document.getElementById("input").value.trim();
      if (!message) {
        appendMessage("Please type a message before sending.", "error");
        return;
      }

      appendMessage(message, "user");
      setLoading(true);

      try {
        const res = await fetch("/api/ai", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        if (!res.ok) throw data;
        appendMessage(data.reply, "ai");
      } catch (error) {
        appendMessage(error?.error || JSON.stringify(error, null, 2), "error");
      } finally {
        setLoading(false);
      }
    }

    async function pay() {
      const phone = document.getElementById("phone").value.trim() || "254111387705";
      const amount = document.getElementById("amount").value || 1;
      const reference = "PICHA AI";

      if (!phone.match(/^254\d{9}$/)) {
        appendMessage("Enter a valid phone number in the format 2547XXXXXXXX.", "error");
        return;
      }

      setLoading(true);
      appendMessage(`Payment request: ${amount} to ${phone}`, "user");

      const url = new URL("http://localhost:5000/pay");
      url.searchParams.set("phone", phone);
      url.searchParams.set("amount", amount);
      url.searchParams.set("reference", reference);

      try {
        const res = await fetch(url.toString());
        const data = await res.json();
        if (!res.ok) throw data;
        appendMessage(JSON.stringify(data, null, 2), "ai");
      } catch (error) {
        appendMessage(error?.error || JSON.stringify(error, null, 2), "error");
      } finally {
        setLoading(false);
      }
    }
  </script>
</body>
</html>
